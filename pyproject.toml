[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-terminal-mcp"
version = "1.0.0"
description = "Persistent SSH/serial terminal MCP with MobaXterm read-only observer gating"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp==2.1.1",
  "paramiko==3.5.1",
  "pyserial==3.5",
]

[project.scripts]
network-terminal-mcp = "network_terminal_mcp.server:main"

[tool.setuptools]
packages = ["network_terminal_mcp"]
